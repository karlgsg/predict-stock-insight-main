services:
  ml:
    build:
      context: ./server-ml
    env_file:
      - ./server-ml/.env
    ports:
      - "8002:8002"
    volumes:
      - ./server-ml/bundles:/app/bundles:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    depends_on:
      ml:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
